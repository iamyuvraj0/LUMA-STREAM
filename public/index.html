<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090c" />
  <meta name="description" content="LUMA Stream — a cinematic movie and TV discovery interface powered by TMDB." />
  <title>LUMA Stream</title>
  <script>try{const s=JSON.parse(localStorage.getItem('luma-settings')||'{}');const t=s.theme==='light'?'light':s.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):'dark';document.documentElement.dataset.theme=t}catch{document.documentElement.dataset.theme=localStorage.getItem('luma-theme')||'dark';}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
